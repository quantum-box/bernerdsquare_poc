name = "banasku-touch-entry-local"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-28"

[build]
command = "worker-build --release"

[vars]
MODE = "mock"

[[d1_databases]]
binding = "DB"
database_name = "banasku-touch-entry-local"
# Local Wrangler uses its local D1 store; this ID is never deployed.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[package]
name = "banasku-touch-entry-api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "wasmbind"] }
cms = "0.2.3"
const-oid = "0.9.6"
der = "0.7.10"
hex = "0.4"
http = "1.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tower-service = "0.3"
uuid = { version = "1", features = ["js", "serde", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["d1", "http"] }
x509-cert = "0.2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
spki = "0.7.3"

[dev-dependencies]
rsa = { version = "0.9.7", features = ["sha1"] }

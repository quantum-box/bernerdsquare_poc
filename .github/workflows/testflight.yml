name: Upload iOS app to TestFlight

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-main
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'quantum-box/bernerdsquare_poc' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install signing assets and App Store Connect API key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing APP_STORE_CONNECT_API_KEY_ID secret}"
          : "${APP_STORE_CONNECT_API_PRIVATE_KEY:?Missing APP_STORE_CONNECT_API_PRIVATE_KEY secret}"
          : "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:?Missing IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 secret}"
          : "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:?Missing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD secret}"
          : "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64:?Missing IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 secret}"

          app_bundle_id="jp.quantumbox.banasku.touch-entry-poc"
          key_dir="$RUNNER_TEMP/app-store-connect-private-keys"
          signing_dir="$RUNNER_TEMP/ios-signing"
          keychain_path="$RUNNER_TEMP/banasku-signing.keychain-db"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$profile_dir/BanaskuTouchEntry-${GITHUB_RUN_ID}.mobileprovision"

          mkdir -p "$key_dir" "$signing_dir" "$profile_dir"
          api_key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "ASC_AUTH_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

          certificate_path="$signing_dir/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$IOS_APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          profile_plist="$signing_dir/profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")
          profile_app_id_prefix=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")
          profile_get_task_allow=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")

          if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "Provisioning profile belongs to a different Apple Developer team" >&2
            exit 1
          fi
          if [[ "$profile_app_id" != "$profile_app_id_prefix.$app_bundle_id" ]]; then
            echo "Provisioning profile does not match $app_bundle_id" >&2
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.pass-type-identifiers' "$profile_plist" >/dev/null 2>&1; then
            echo "Provisioning profile is missing the Wallet entitlement required by the app" >&2
            exit 1
          fi
          if [[ "$profile_get_task_allow" != "false" ]] || /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "An App Store distribution provisioning profile is required" >&2
            exit 1
          fi

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          existing_keychains=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing APP_STORE_CONNECT_API_KEY_ID secret}"
          : "${APP_STORE_CONNECT_API_ISSUER_ID:?Missing APP_STORE_CONNECT_API_ISSUER_ID secret}"
          : "${ASC_AUTH_KEY_PATH:?App Store Connect API key was not installed}"
          : "${IOS_PROFILE_NAME:?App Store provisioning profile was not installed}"

          archive_path="$RUNNER_TEMP/BanaskuTouchEntry.xcarchive"
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -project ios/BanaskuTouchEntry.xcodeproj \
            -scheme BanaskuTouchEntry \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            archive

          python3 - "$export_options_path" "$APPLE_TEAM_ID" "$IOS_PROFILE_NAME" <<'PY'
          import plistlib
          import sys

          path, team_id, profile_name = sys.argv[1:]
          options = {
              "destination": "upload",
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store-connect",
              "provisioningProfiles": {
                  "jp.quantumbox.banasku.touch-entry-poc": profile_name,
              },
              "signingCertificate": "Apple Distribution",
              "signingStyle": "manual",
              "teamID": team_id,
              "uploadSymbols": True,
          }
          with open(path, "wb") as output:
              plistlib.dump(options, output)
          PY

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$RUNNER_TEMP/TestFlightUpload" \
            -exportOptionsPlist "$export_options_path" \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove App Store Connect and signing assets
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/banasku-signing.keychain-db"
          profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/BanaskuTouchEntry-${GITHUB_RUN_ID}.mobileprovision"

          if [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]]; then
            rm -f "$RUNNER_TEMP/app-store-connect-private-keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          fi
          rm -rf "$RUNNER_TEMP/ios-signing"
          rm -f "$profile_path"

          if [[ -e "$keychain_path" ]]; then
            remaining_keychains=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" && "$keychain" != "$keychain_path" ]] && remaining_keychains+=("$keychain")
            done < <(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')
            if [[ ${#remaining_keychains[@]} -gt 0 ]]; then
              security list-keychains -d user -s "${remaining_keychains[@]}"
            fi
            security delete-keychain "$keychain_path" || true
          fi

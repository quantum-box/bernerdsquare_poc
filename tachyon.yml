apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: banasku-touch-entry
  tenantId: tn_01kshr165k3wwr8xyk0e6vy36c
spec:
  apps:
    - name: banasku-touch-entry-api
      repository:
        url: https://github.com/quantum-box/bernerdsquare_poc
        owner: quantum-box
        name: bernerdsquare_poc
        defaultBranch: main
      rootDirectory: api
      # Use the generic Worker bootstrap so we can install the pinned Rust
      # toolchain before worker-build; the Rust Worker bootstrap installs
      # worker-build before custom install commands run.
      framework: worker
      deploymentTarget: cloudflare_workers
      build:
        installCommand: >-
          rustup toolchain install 1.91.0 --profile minimal --target wasm32-unknown-unknown &&
          RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo cargo +1.91.0 install
          --root /tmp/tachyon-build-bin --locked --version 0.8.7 worker-build &&
          ln -sf /tmp/tachyon-build-bin/bin/worker-build /tmp/tachyon-build-bin/worker-build
        command: RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo worker-build --release
        runnerBackend: kubernetes_kata
      readinessProof:
        path: /healthz
        expectedStatus: 200
      worker:
        generateConfig: true
        main: build/worker/shim.mjs
        compatibilityDate: "2026-09-28"
      d1Databases:
        - binding: DB
          databaseName: banasku-touch-entry
          migrationsDir: migrations
      watchPaths:
        - api/**
        - tachyon.yml
      envVars:
        - name: MODE
          value: mock
        - name: ALLOW_TIME_SIMULATION
          value: "false"
        - name: WALLET_PASS_TYPE_IDENTIFIER
          value: pass.jp.quantumbox.banasku.touch-entry-poc
        - name: WALLET_TEAM_IDENTIFIER
          value: J8429VCGMR
        - name: WALLET_ORGANIZATION_NAME
          value: Banasku

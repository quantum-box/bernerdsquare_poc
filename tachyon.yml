apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: banasku-touch-entry
  tenantId: tn_01kshr165k3wwr8xyk0e6vy36c
spec:
  apps:
    - name: banasku-touch-entry-api
      repository:
        url: https://github.com/quantum-box/bernerdsquare_poc
        owner: quantum-box
        name: bernerdsquare_poc
        defaultBranch: main
      rootDirectory: api
      framework: rust_worker
      deploymentTarget: cloudflare_workers
      build:
        installCommand: rustup target add wasm32-unknown-unknown && cargo install 'worker-build@=0.8.6' --locked
        command: worker-build --release
        runnerBackend: kubernetes_kata
      readinessProof:
        path: /healthz
        expectedStatus: 200
      worker:
        generateConfig: true
        main: build/worker/shim.mjs
        compatibilityDate: "2026-09-28"
      d1Databases:
        - binding: DB
          databaseName: banasku-touch-entry
          migrationsDir: migrations
      watchPaths:
        - api/**
        - tachyon.yml
      envVars:
        - name: MODE
          value: mock
        - name: ALLOW_TIME_SIMULATION
          value: "false"
        - name: WALLET_PASS_TYPE_IDENTIFIER
          value: pass.jp.quantumbox.banasku.touch-entry-poc
        - name: WALLET_TEAM_IDENTIFIER
          value: J8429VCGMR
        - name: WALLET_ORGANIZATION_NAME
          value: Banasku
        - name: WALLET_SIGNER_PRIVATE_KEY_PKCS8_B64
          type: credential
          target: preview
          valueFrom:
            secret: banasku-touch-entry-api/WALLET_SIGNER_PRIVATE_KEY_PKCS8_B64
        - name: WALLET_SIGNER_CERTIFICATE_DER_B64
          type: credential
          target: preview
          valueFrom:
            secret: banasku-touch-entry-api/WALLET_SIGNER_CERTIFICATE_DER_B64
        - name: WALLET_WWDR_CERTIFICATE_DER_B64
          type: credential
          target: preview
          valueFrom:
            secret: banasku-touch-entry-api/WALLET_WWDR_CERTIFICATE_DER_B64
        - name: API_BEARER_TOKENS_JSON
          type: credential
          target: preview
          valueFrom:
            secret: banasku-touch-entry-api/API_BEARER_TOKENS_JSON
